services:

  app:
    build: .
    volumes:
      - lesson12data:/app/data
    networks:
      front:
        aliases:
          - counter
      back:

  nginx:
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      front:
      myproxynet:
        aliases:
          - lesson12-web

  # «внутренний сервис» — заглушка вместо базы данных:
  # торчит только в изолированной сети back
  storage:
    image: nginx:alpine
    networks:
      - back

volumes:
  lesson12data:

networks:
  front:
  back:
    internal: true
  myproxynet:
    name: my-proxy-net
    external: true
