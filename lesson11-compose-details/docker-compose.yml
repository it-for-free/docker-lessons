services:

  app:
    build: .
    restart: unless-stopped
    environment:
      - GREETING=${GREETING}
    volumes:
      - lesson11data:/app/data

  nginx:
    image: nginx
    container_name: lesson11-nginx
    ports:
      - ${WEB_PORT}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  lesson11data:
